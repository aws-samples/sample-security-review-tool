AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Fixture template for ATH-002 - Athena WorkGroups must use an S3 output location
  bucket whose bucket policy denies non-TLS requests.

Resources:
  # Scenario: missing-output-location
  # WorkGroup has no ResultConfiguration.OutputLocation, so no results bucket can be identified.
  AthWorkGroupMissingOutputLocation:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: ath002-missing-output-location
      WorkGroupConfiguration:
        ResultConfiguration: {}

  # Scenario: output-bucket-allows-insecure-transport
  # WorkGroup points to a declared bucket whose bucket policy does not deny insecure transport.
  AthWorkGroupInsecureTransport:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: ath002-insecure-transport
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: s3://ath002-insecure-results-bucket/output/

  InsecureResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ath002-insecure-results-bucket

  InsecureResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InsecureResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGetObject
            Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::123456789012:root'
            Action: 's3:GetObject'
            Resource: 'arn:aws:s3:::ath002-insecure-results-bucket/*'
